[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-comic-transcribe"
version = "0.1.0"
description = "Extract and transcribe comic and manga pages from EPUB/CBZ using Vision-Language Models (VLM) with rolling visual history and scene description."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "skygrip" }
]
keywords = [
    "comic",
    "manga",
    "transcription",
    "ocr",
    "vlm",
    "accessibility",
    "epub",
    "cbz",
    "vision-language-model",
    "llama-swap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
dependencies = [
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
comic-transcribe = "llm_comic_transcribe.cli:main"
llm-comic-transcribe = "llm_comic_transcribe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_comic_transcribe"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"transcribe_comic.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
